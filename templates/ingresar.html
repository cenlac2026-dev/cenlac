{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta caja-ingreso">
  <img src="{{ url_for('static', filename='ilustracion-bebe.svg') }}" alt="" class="ingreso-ilustracion">
  <h1>CENLAC</h1>
  <p class="nota">Ingrese con su usuario. Registro de madres donantes del Centro de Lactancia N° 10.</p>
  <form method="post" class="formulario-ingreso">
    <label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña<input type="password" name="clave" autocomplete="current-password" required></label>
    <button type="submit">Ingresar</button>
  </form>
  <p class="nota">¿Olvidó la contraseña? Pídale al administrador que le asigne una nueva.</p>
</section>
{% endblock %}
